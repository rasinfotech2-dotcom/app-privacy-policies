    <h1>Universal Privacy Policy</h1>
    <div class="meta">
      <strong>Developer & Publisher:</strong> NDroidHub<br>

  <h2>1. Introduction & Core Philosophy</h2>
  <p>This Universal Privacy Policy governs all mobile applications, utilities, and developer services published by <strong>NDroidHub</strong> ("we", "our", or "us"). We firmly believe that utility tools should never harvest personal data. All NDroidHub applications are architected under strict <strong>Zero-Personal-Data</strong> and <strong>On-Device Scoped Execution</strong> standards.</p>

  <h2>2. Zero Personal Data Collection</h2>
  <p>Across all our applications, we <strong>DO NOT</strong> collect, store, sell, or transmit any personally identifiable information (PII). Specifically:</p>
  <ul>
    <li>No user account registration or mandatory sign-ins.</li>
    <li>No access to or harvesting of your phonebook, personal contacts, SMS messages, or call logs.</li>
    <li>No real-time GPS tracking or geolocation harvesting.</li>
    <li>No cloud uploading of your private photos, videos, audio notes, or media files.</li>
  </ul>

  <h2>3. Local Storage & Scoped File Access (SAF & MediaStore)</h2>
  <p>Our utility applications (such as status savers, audio extractors, and video splitters) interact with your device's filesystem strictly to deliver the features you explicitly trigger:</p>
  <ul>
    <li><strong>Storage Access Framework (SAF):</strong> On Android 11 through Android 15+, our apps request folder-scoped user consent via the standard Android system picker. The app only accesses files in directories you explicitly grant.</li>
    <li><strong>Zero Cloud Telemetry:</strong> All file processing (including status previewing, lossless audio extraction, video trimming, and quote generation) occurs entirely offline within device memory. Nothing is ever uploaded to external servers.</li>
  </ul>

  <h2>4. Advertising & Mediation Transparency</h2>
  <p>To keep our applications freely accessible worldwide across Google Play and over 19 alternative app stores, our apps may display advertisements managed by industry-leading mediation platforms (such as Unity LevelPlay / ironSource):</p>
  <ul>
    <li>These platforms may collect anonymized, non-personal technical telemetry (e.g., device model, OS version, locale, screen density) strictly for fraud prevention and ad frequency control.</li>
    <li>Users may opt out of personalized ads at any time through standard Android system settings: <em>Settings → Google → Ads → Delete advertising ID</em>.</li>
  </ul>

  <h2>5. Children's Privacy (COPPA Compliance)</h2>
  <p>Our applications are designed as general-audience utilities and do not target children under the age of 13. We do not knowingly collect information from children.</p>

  <h2>6. Global Regulatory Compliance (GDPR, CCPA & Global Store Policies)</h2>
  <p>Under GDPR, CCPA, and store privacy mandates, users have fundamental data rights. Because our applications store zero user data on remote servers, no personal profile exists to delete or export. Clearing your app cache or uninstalling the app permanently purges all local state from your device.</p>
